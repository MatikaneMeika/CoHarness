# 远端门禁（第二道门）：本地钩子第一道；CI 检测线默认只可见不拦截，启用 required check 才是硬门禁；--no-verify 逃得过本地，逃不过启用硬门禁后的远端。
name: coharness-gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # v4.x.y；高安全仓库可换 40 位 SHA
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5  # v5.x.y；高安全仓库可换 40 位 SHA
        with:
          python-version: "3.11"
      - name: CoHarness gate (names + tasks + against)
        shell: bash
        env:
          COHARNESS_AGAINST: ${{ github.event_name == 'pull_request' && 'origin/main' || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -z "$COHARNESS_AGAINST" ] || [ "$COHARNESS_AGAINST" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::远端门禁基线不可用；本次降级为 names + tasks"
            python scripts/check.py --names --tasks --no-track
          else
            if ! git rev-parse --verify -q "$COHARNESS_AGAINST^{commit}" >/dev/null || \
               ! git merge-base "$COHARNESS_AGAINST" HEAD >/dev/null; then
              echo "::notice::远端门禁基线不可达；本次降级为 names + tasks"
              python scripts/check.py --names --tasks --no-track
            else
              python scripts/check.py --names --tasks --against "$COHARNESS_AGAINST" --no-track
            fi
          fi
