name: CI

# 两个 job 的分工：
#   stdlib —— 分发物承诺的那条路径：不装任何包，`python -m unittest discover -s tests` 必须绿
#   oracle —— 开发期差分预言机（python-frontmatter）真跑，验证自写子集解析器没读错
#
# 本机没有 act / docker，这个文件写下来但没在本地跑过 Actions；首次真跑发生在 push 之后。

on:
  push:
  pull_request:

jobs:
  stdlib:
    name: 零依赖自测 ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.12 腿专门验 rmtree(onexc) 分支（3.11 走 onerror）；macOS 补 POSIX 第三形态，
        # 路径分隔符/终端行为类问题不许等用户撞上才发现。
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: git 版本（钩子端到端测试要用 sh 跑 pre-commit）
        run: git --version
      - name: unittest（不安装任何依赖）
        # 失败时把红掉的测试名写成 annotation：job 日志要登录才能看，annotation 公开页面就能读。
        # 两个坑都踩过，都写在这：① GitHub 给 shell: bash 默认加 set -e -o pipefail，grep 没匹配到
        # 就返回1并中止整步，所以每条管道都要 || true；② 成功时也不许发 ::error::——那会把一条
        # 本来全绿的腿直接染红（实测：五条腿 rc=0、245 条 OK，仍全部判 failed）。
        shell: bash
        run: |
          log=$(mktemp)
          # 必须临时关掉 errexit：GitHub 的 bash 带 -e，测试一失败脚本就中止，
          # 下面的 rc/失败名单 annotation 永远发不出去（windows 两条腿就是这样静默红的）。
          set +e
          python -m unittest discover -s tests -v > "$log" 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            fails=$(grep -cE '^(FAIL|ERROR): ' "$log" || true)
            ran=$(grep -E '^Ran |^OK|^FAILED' "$log" | tail -2 | tr '\n' ' ' || true)
            echo "::error::rc=$rc 匹配到 $fails 条  总结行: $ran"
            grep -E '^(FAIL|ERROR): ' "$log" | head -20 | sed 's/^/::error::/' || true
            tail -6 "$log" | sed 's/^/::error::tail: /' || true
          else
            echo "自测全绿：$(grep -E '^Ran ' "$log" | tail -1 || true)"
          fi
          exit $rc

  oracle:
    name: 差分预言机对照（python-frontmatter）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: 装开发期预言机（不进分发物）
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python python-frontmatter pyyaml
      - name: 全套测试（此时差分用例不 skip）
        shell: bash
        run: |
          log=$(mktemp)
          set +e
          .venv/bin/python -m unittest discover -s tests -v > "$log" 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            fails=$(grep -cE '^(FAIL|ERROR): ' "$log" || true)
            ran=$(grep -E '^Ran |^OK|^FAILED' "$log" | tail -2 | tr '\n' ' ' || true)
            echo "::error::rc=$rc 匹配到 $fails 条  总结行: $ran"
            grep -E '^(FAIL|ERROR): ' "$log" | head -20 | sed 's/^/::error::/' || true
            tail -6 "$log" | sed 's/^/::error::tail: /' || true
          else
            echo "自测全绿（预言机在场）：$(grep -E '^Ran ' "$log" | tail -1 || true)"
          fi
          exit $rc

  # 计划书 #3 的口径是"clone → 首次开工 ≤ 5 分钟（CI 计时）"。本地单次实测 2.6 秒，
  # 但那是开发机：有全局 git 身份、盘也不同，数字不进断言。这条 job 在干净 runner 上
  # 跑同一条序列，超 300 秒判红，实测值发 notice（公开页无需登录就能读）。
  first-run:
    name: 开工计时 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 装机 → 首次 commit → 开工协议，全程计时
        shell: bash
        run: |
          # runner 没有全局 git 身份，这里必须自己给一个——那是 CI 第一轮全红的真因，别再蹭环境。
          git config --global user.email ci@example.com
          git config --global user.name ci
          # 不用 $RUNNER_TEMP 拼路径：windows 上它是反斜杠的 8.3 短名，在 Git bash 里会咬人（踩过）。
          work=$(mktemp -d)
          proj="$work/proj"
          set -e
          t0=$(date +%s%3N)
          python wsc.py init 03 "$proj" > "$work/init.log" 2>&1
          cd "$proj"
          git init -q -b main .
          git add -A
          git commit -q -m "首次开工"
          python "$GITHUB_WORKSPACE/wsc.py" sync . > "$work/sync.log" 2>&1
          t1=$(date +%s%3N)
          ms=$((t1 - t0))
          echo "::notice::开工计时 ${ms} ms（装机 + 首次提交 + sync，干净 runner、零 pip 依赖）"
          if [ $ms -gt 300000 ]; then
            echo "::error::开工计时 ${ms} ms 超过 5 分钟上限"
            tail -20 "$work/init.log" | sed 's/^/::error::init: /' || true
            tail -20 "$work/sync.log" | sed 's/^/::error::sync: /' || true
            exit 1
          fi
          # 计时之外再确认装出来的东西自洽：钩子已在"首次提交"那步真跑过并放行，
          # 这里让项目自己的 check.py 也认这份装机。
          python "$GITHUB_WORKSPACE/wsc.py" check . > "$work/check.log" 2>&1
          tail -3 "$work/check.log"

  # I-004 的端到端证明（2026-09-29）：merge/rebase 不跑 pre-commit，两个各自合法的提交
  # 合出来的非法看板，由 pre-push 钩子在推送前拦下。干净 runner 上真造一遍这个形态：
  # 同一 harness 在两个基上各领一张卡 → merge 凑出"两张 doing"→ 推送必须被拦。
  push-gate:
    name: 推送门（I-004）端到端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 装机 → 两基合法认领 → merge 凑非法 → 推送必须被拦
        shell: bash
        run: |
          # runner 没有全局 git 身份，自己给一个（第一轮 CI 全红的真因，别蹭环境）
          git config --global user.email ci@example.com
          git config --global user.name ci
          work=$(mktemp -d)
          set -e
          git init -q --bare -b main "$work/origin.git"
          proj="$work/proj"
          mkdir "$proj" && cd "$proj"
          git init -q -b main .
          python "$GITHUB_WORKSPACE/wsc.py" init 03 . > /dev/null   # 仓库在场：双钩子直接装上
          python - <<'PY'
          from pathlib import Path
          t = Path("backlog/tasks"); t.mkdir(parents=True, exist_ok=True)
          card = """---
          id: {cid}
          title: 卡 {cid}
          status: todo
          assignee: []
          labels: []
          created_date: 2026-09-29
          updated_date: 2026-09-29 09:00
          ---

          ## 需求
          {cid}

          ## 边界
          allowed_paths:
            - {allowed}
          forbidden_paths:
            - AGENTS.md

          ## 验收清单
          - [ ] check.py 全绿

          ## 交接说明
          （收工时填）
          """
          for cid, allowed in (("T-001", "docs/"), ("T-002", "code/")):
              (t / f"{cid}.md").write_text(card.format(cid=cid, allowed=allowed), encoding="utf-8")
          PY
          git add -A
          git commit -q -m "首次开工"          # 首次入库不执法
          git remote add origin "$work/origin.git"
          git push -q origin main
          # main 上：T-001 → doing same-owner（此刻看板合法，pre-commit 放行）
          sed -i 's/^status: todo/status: doing/; s/^assignee: \[\]/assignee: [same-owner]/' backlog/tasks/T-001.md
          git add backlog/tasks/T-001.md && git commit -q -m "领 T-001"
          git push -q origin main
          # wt-b 停在旧基（T-001 还是 todo）：T-002 → doing same-owner，提交合法
          git worktree add -q "$work/wt-b" -b wt-b HEAD~1
          cd "$work/wt-b"
          sed -i 's/^status: todo/status: doing/; s/^assignee: \[\]/assignee: [same-owner]/' backlog/tasks/T-002.md
          git add backlog/tasks/T-002.md && git commit -q -m "领 T-002"
          # merge 把两张 doing 合到一起：merge 不跑 pre-commit，非法态在本地凑成
          git fetch -q origin
          git merge -q --no-edit origin/main
          # 推送必须被 pre-push 拦下——非法看板进不了 main（stdout+stderr 全捕获：
          # check.py 的冲突报告走 stdout，只捕 stderr 会漏掉拦截原因）
          if git push origin HEAD:main > "$work/push.log" 2>&1; then
            echo "::error::非法看板竟被推上 main——I-004 推送门失效"
            tail -20 "$work/push.log" | sed 's/^/::error::/' || true
            exit 1
          fi
          grep -q "认领冲突" "$work/push.log" || {
            echo "::error::拦截原因不是看板非法，检查 pre-push 钩子"
            cat "$work/push.log"
            exit 1
          }
          echo "I-004 端到端 ✓：合并凑出的非法看板在推送前被拦下"
